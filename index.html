<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Cash Calculator — JeJo Barista Aylesbury</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px 0;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 24px 20px;
      width: 100%;
      max-width: 640px;
    }

    h1 { font-size: 1.3rem; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 0.82rem; margin-bottom: 20px; }

    /* Section headers */
    .section-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .section-title.coins { background: #6366f1; }
    .section-title.notes { background: #0ea5e9; }

    /* Table header */
    .table-header {
      display: grid;
      gap: 8px;
      padding: 0 4px 8px;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 8px;
    }

    .coins-header { grid-template-columns: 58px 1fr 62px 72px; }
    .notes-header { grid-template-columns: 58px 1fr 72px; }

    .table-header span {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
    }

    .table-header span:nth-child(2) { text-align: center; }
    .table-header span:nth-child(3) { text-align: center; }
    .table-header span:nth-child(4) { text-align: right; }

    /* Rows */
    .coin-grid, .notes-grid { display: grid; gap: 6px; margin-bottom: 20px; }

    .coin-row {
      display: grid;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .coin-row:hover { background: #f9fafb; }
    .coin-row.active { background: #f0f4ff; }
    .note-row.active { background: #f0f9ff; }

    .coins-row { grid-template-columns: 58px 1fr 62px 72px; }
    .notes-row { grid-template-columns: 58px 1fr 72px; }

    .coin-label { font-weight: 700; font-size: 0.95rem; color: #1f2937; }
    .coin-label span { display: block; font-size: 0.65rem; font-weight: 400; color: #9ca3af; }

    input[type="number"] {
      width: 100%;
      padding: 10px 8px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      color: #111827;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
      appearance: textfield;
      text-align: center;
      min-height: 44px;
    }

    input[type="number"]:focus { outline: none; border-color: #6366f1; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 1; }

    .coin-count { font-size: 0.85rem; color: #6b7280; text-align: center; font-variant-numeric: tabular-nums; }
    .coin-count.has-value { color: #374151; font-weight: 600; }

    .coin-value { font-size: 0.9rem; font-weight: 700; color: #d1d5db; text-align: right; font-variant-numeric: tabular-nums; }
    .coin-value.has-value { color: #059669; }
    .note-value.has-value { color: #0ea5e9; }

    /* Totals */
    .totals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .subtotal-bar {
      border-radius: 10px;
      padding: 12px 14px;
    }

    .subtotal-bar.coins { background: #f0f4ff; border: 1.5px solid #c7d2fe; }
    .subtotal-bar.notes { background: #f0f9ff; border: 1.5px solid #bae6fd; }

    .subtotal-label { font-size: 0.72rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .subtotal-value { font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .subtotal-bar.coins .subtotal-value { color: #4338ca; }
    .subtotal-bar.notes .subtotal-value { color: #0284c7; }

    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a2e;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    .total-label { font-weight: 700; color: #e5e7eb; font-size: 0.9rem; }
    .total-label span { display: block; font-size: 0.72rem; font-weight: 400; color: #6b7280; }
    .total-value { font-size: 1.8rem; font-weight: 800; color: #a5b4fc; font-variant-numeric: tabular-nums; }

    /* Buttons */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }

    button {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      min-height: 44px;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    #exportBtn { background: #6366f1; color: white; }
    #resetBtn { background: #f3f4f6; color: #374151; border: 1.5px solid #e5e7eb; }

    /* Signature */
    .signature-bar {
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: 18px 12px 24px;
    }

    .signature-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #4338ca;
      letter-spacing: 0.04em;
    }

    .signature-sub {
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* Divider */
    .section-gap { margin-bottom: 20px; }

    /* Responsive */
    @media (max-width: 400px) {
      .container { padding: 18px 12px; }
      .totals-grid { grid-template-columns: 1fr; }
      .coins-row, .coins-header { grid-template-columns: 50px 1fr 54px 64px; }
      .notes-row, .notes-header { grid-template-columns: 50px 1fr 64px; }
      .total-value { font-size: 1.5rem; }
    }

    /* Print styles */
    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; border-radius: 0; max-width: 100%; }
      .btn-row, #exportBtn, #resetBtn { display: none; }
      .signature-bar { padding-bottom: 10px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🪙 UK Cash Calculator</h1>
  <p class="subtitle">Coins by weight (g) · Notes by quantity · Updates instantly</p>

  <!-- COINS -->
  <div class="section-gap">
    <div class="section-title coins">Coins</div>
    <div class="table-header coins-header">
      <span>Coin</span>
      <span>Weight (g)</span>
      <span style="text-align:center">Count</span>
      <span style="text-align:right">Value</span>
    </div>
    <div class="coin-grid" id="coinGrid"></div>
  </div>

  <!-- NOTES -->
  <div class="section-gap">
    <div class="section-title notes">Notes</div>
    <div class="table-header notes-header">
      <span>Note</span>
      <span>Quantity</span>
      <span style="text-align:right">Value</span>
    </div>
    <div class="notes-grid" id="notesGrid"></div>
  </div>

  <!-- TOTALS -->
  <div class="totals-grid">
    <div class="subtotal-bar coins">
      <div class="subtotal-label">Coins Total</div>
      <div class="subtotal-value" id="coinsTotal">£0.00</div>
    </div>
    <div class="subtotal-bar notes">
      <div class="subtotal-label">Notes Total</div>
      <div class="subtotal-value" id="notesTotal">£0.00</div>
    </div>
  </div>

  <div class="total-bar">
    <div class="total-label">
      Grand Total
      <span id="totalCoins">0 items</span>
    </div>
    <div class="total-value" id="grandTotal">£0.00</div>
  </div>

  <div class="btn-row">
    <button id="exportBtn">⬇ Export PDF</button>
    <button id="resetBtn">↺ Reset All</button>
  </div>
</div>

<!-- SIGNATURE -->
<div class="signature-bar">
  <div class="signature-name">JeJo Barista · Aylesbury</div>
  <div class="signature-sub">UK Cash Calculator</div>
</div>

<script>
  const COINS = [
    { label: '£2',  pence: 200, weight: 12.00 },
    { label: '£1',  pence: 100, weight: 8.75  },
    { label: '50p', pence: 50,  weight: 8.00  },
    { label: '20p', pence: 20,  weight: 5.00  },
    { label: '10p', pence: 10,  weight: 6.50  },
    { label: '5p',  pence: 5,   weight: 3.25  },
    { label: '2p',  pence: 2,   weight: 7.12  },
    { label: '1p',  pence: 1,   weight: 3.56  },
  ];

  const NOTES = [
    { label: '£50', pence: 5000 },
    { label: '£20', pence: 2000 },
    { label: '£10', pence: 1000 },
    { label: '£5',  pence: 500  },
  ];

  // Build coin rows
  const coinGrid = document.getElementById('coinGrid');
  COINS.forEach((coin, i) => {
    const row = document.createElement('div');
    row.className = 'coin-row coins-row';
    row.id = `crow${i}`;
    row.innerHTML = `
      <div class="coin-label">${coin.label}<span>${coin.weight}g</span></div>
      <input type="number" id="cg${i}" min="0" step="any" placeholder="0g">
      <div class="coin-count" id="ccount${i}">—</div>
      <div class="coin-value" id="cval${i}">—</div>
    `;
    coinGrid.appendChild(row);
    row.querySelector(`#cg${i}`).addEventListener('input', recalculate);
  });

  // Build notes rows
  const notesGrid = document.getElementById('notesGrid');
  NOTES.forEach((note, i) => {
    const row = document.createElement('div');
    row.className = 'coin-row notes-row';
    row.id = `nrow${i}`;
    row.innerHTML = `
      <div class="coin-label">${note.label}<span>note</span></div>
      <input type="number" id="nq${i}" min="0" step="1" placeholder="0">
      <div class="coin-value note-value" id="nval${i}">—</div>
    `;
    notesGrid.appendChild(row);
    row.querySelector(`#nq${i}`).addEventListener('input', recalculate);
  });

  function fmt(pence) {
    if (pence === 0) return '—';
    return pence >= 100 ? `£${(pence / 100).toFixed(2)}` : `${pence}p`;
  }

  function fmtTotal(pence) {
    return pence >= 100 ? `£${(pence / 100).toFixed(2)}` : `${pence}p`;
  }

  function recalculate() {
    let coinPence = 0, notePence = 0, totalItems = 0;

    COINS.forEach((coin, i) => {
      const g = parseFloat(document.getElementById(`cg${i}`).value) || 0;
      const countEl = document.getElementById(`ccount${i}`);
      const valEl   = document.getElementById(`cval${i}`);
      const row     = document.getElementById(`crow${i}`);

      if (g > 0) {
        const count = Math.round(g / coin.weight);
        const p = count * coin.pence;
        coinPence += p; totalItems += count;
        countEl.textContent = count; countEl.className = 'coin-count has-value';
        valEl.textContent = fmt(p);  valEl.className = 'coin-value has-value';
        row.classList.add('active');
      } else {
        countEl.textContent = '—'; countEl.className = 'coin-count';
        valEl.textContent = '—';   valEl.className = 'coin-value';
        row.classList.remove('active');
      }
    });

    NOTES.forEach((note, i) => {
      const qty = parseInt(document.getElementById(`nq${i}`).value) || 0;
      const valEl = document.getElementById(`nval${i}`);
      const row   = document.getElementById(`nrow${i}`);

      if (qty > 0) {
        const p = qty * note.pence;
        notePence += p; totalItems += qty;
        valEl.textContent = fmt(p); valEl.className = 'coin-value note-value has-value';
        row.classList.add('active');
      } else {
        valEl.textContent = '—'; valEl.className = 'coin-value note-value';
        row.classList.remove('active');
      }
    });

    document.getElementById('coinsTotal').textContent = fmtTotal(coinPence);
    document.getElementById('notesTotal').textContent = fmtTotal(notePence);
    document.getElementById('grandTotal').textContent = fmtTotal(coinPence + notePence);
    document.getElementById('totalCoins').textContent =
      totalItems > 0 ? `${totalItems} coins & notes` : '0 items';
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    COINS.forEach((_, i) => document.getElementById(`cg${i}`).value = '');
    NOTES.forEach((_, i) => document.getElementById(`nq${i}`).value = '');
    recalculate();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    window.print();
  });
</script>
</body>
</html>
