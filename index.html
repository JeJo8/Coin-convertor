<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Coin Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 24px 20px;
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-size: 1.3rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.82rem;
      margin-bottom: 20px;
    }

    /* Header row */
    .table-header {
      display: grid;
      grid-template-columns: 58px 1fr 72px 72px;
      gap: 8px;
      padding: 0 4px 8px;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 8px;
    }

    .table-header span {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
    }

    .table-header span:nth-child(2) { text-align: center; }
    .table-header span:nth-child(3) { text-align: center; }
    .table-header span:nth-child(4) { text-align: right; }

    /* Coin rows */
    .coin-grid { display: grid; gap: 6px; margin-bottom: 20px; }

    .coin-row {
      display: grid;
      grid-template-columns: 58px 1fr 72px 72px;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .coin-row:hover { background: #f9fafb; }
    .coin-row.active { background: #f0f4ff; }

    .coin-label {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1f2937;
    }

    .coin-label span {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: #9ca3af;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 8px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      color: #111827;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
      appearance: textfield;
      text-align: center;
      /* larger tap target on mobile */
      min-height: 44px;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #6366f1;
      background: #fff;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 1; }

    .coin-count {
      font-size: 0.85rem;
      color: #6b7280;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .coin-count.has-value { color: #374151; font-weight: 600; }

    .coin-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: #d1d5db;
      text-align: right;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }

    .coin-value.has-value { color: #059669; }

    /* Total */
    .total-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f4ff;
      border: 1.5px solid #c7d2fe;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .total-label {
      font-weight: 700;
      color: #374151;
      font-size: 0.9rem;
    }

    .total-label span {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #9ca3af;
    }

    .total-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: #4338ca;
      font-variant-numeric: tabular-nums;
    }

    /* Reset */
    #resetBtn {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e5e7eb;
      background: white;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      min-height: 44px;
    }

    #resetBtn:hover { background: #f9fafb; color: #374151; }

    .signature {
      margin-top: 20px;
      text-align: center;
      font-size: 0.78rem;
      color: #9ca3af;
      letter-spacing: 0.03em;
    }

    .signature strong { color: #6366f1; font-weight: 600; }

    @media (max-width: 400px) {
      .container { padding: 20px 14px; }
      h1 { font-size: 1.15rem; }
      .table-header,
      .coin-row { grid-template-columns: 50px 1fr 62px 62px; }
      .total-value { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🪙 UK Coin Calculator</h1>
  <p class="subtitle">Enter weight in grams — count and value update instantly</p>

  <div class="table-header">
    <span>Coin</span>
    <span>Weight (g)</span>
    <span>Count</span>
    <span style="text-align:right">Value</span>
  </div>

  <div class="coin-grid" id="coinGrid"></div>

  <div class="total-bar">
    <div class="total-label">
      Total Value
      <span id="totalCoins">0 coins entered</span>
    </div>
    <div class="total-value" id="totalValue">£0.00</div>
  </div>

  <button id="resetBtn">↺ Reset All</button>

  <div class="signature">Made by <strong>JeJo Barista Aylesbury</strong></div>
</div>

<script>
  const COINS = [
    { label: '£2',  pence: 200, weight: 12.00 },
    { label: '£1',  pence: 100, weight: 8.75  },
    { label: '50p', pence: 50,  weight: 8.00  },
    { label: '20p', pence: 20,  weight: 5.00  },
    { label: '10p', pence: 10,  weight: 6.50  },
    { label: '5p',  pence: 5,   weight: 3.25  },
    { label: '2p',  pence: 2,   weight: 7.12  },
    { label: '1p',  pence: 1,   weight: 3.56  },
  ];

  const grid = document.getElementById('coinGrid');

  COINS.forEach((coin, i) => {
    const row = document.createElement('div');
    row.className = 'coin-row';
    row.id = `row${i}`;
    row.innerHTML = `
      <div class="coin-label">
        ${coin.label}
        <span>${coin.weight}g each</span>
      </div>
      <input type="number" id="g${i}" min="0" step="any" placeholder="0g">
      <div class="coin-count" id="count${i}">—</div>
      <div class="coin-value" id="val${i}">—</div>
    `;
    grid.appendChild(row);

    row.querySelector(`#g${i}`).addEventListener('input', recalculate);
  });

  function formatValue(pence) {
    if (pence === 0) return '—';
    return pence >= 100 ? `£${(pence / 100).toFixed(2)}` : `${pence}p`;
  }

  function recalculate() {
    let totalPence = 0;
    let totalCoins = 0;

    COINS.forEach((coin, i) => {
      const grams = parseFloat(document.getElementById(`g${i}`).value) || 0;
      const countEl = document.getElementById(`count${i}`);
      const valEl = document.getElementById(`val${i}`);
      const row = document.getElementById(`row${i}`);

      if (grams > 0) {
        const count = Math.round(grams / coin.weight);
        const pence = count * coin.pence;
        totalPence += pence;
        totalCoins += count;

        countEl.textContent = count;
        countEl.className = 'coin-count has-value';
        valEl.textContent = formatValue(pence);
        valEl.className = 'coin-value has-value';
        row.classList.add('active');
      } else {
        countEl.textContent = '—';
        countEl.className = 'coin-count';
        valEl.textContent = '—';
        valEl.className = 'coin-value';
        row.classList.remove('active');
      }
    });

    const total = totalPence >= 100
      ? `£${(totalPence / 100).toFixed(2)}`
      : `${totalPence}p`;

    document.getElementById('totalValue').textContent = totalPence > 0 ? total : '£0.00';
    document.getElementById('totalCoins').textContent =
      totalCoins > 0 ? `${totalCoins} coins total` : '0 coins entered';
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    COINS.forEach((_, i) => {
      document.getElementById(`g${i}`).value = '';
    });
    recalculate();
  });
</script>
</body>
</html>
