// ─── Closing history row (desktop) ───────────────────────────
function ClosingHistoryRow({ row, canDelete, onDelete, onTillRoll }) {
  const [expanded, setExpanded] = useState(false);
  const date = new Date(row.closed_at);
  const reconciled = row.count_basis === 'reconciled';
  const variance = reconciled && (row.opening_float_pence || 0) > 0
    ? (row.total_pence || 0) - (row.cash_removed_pence || 0) - row.opening_float_pence
    : null;
  return (
    <div className="card" style={{ overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <button
          onClick={() => setExpanded(e => !e)}
          aria-expanded={expanded}
          style={{
            display: 'flex', alignItems: 'center', gap: 12,
            padding: '12px 8px 12px 16px', flex: 1, minWidth: 0,
            background: 'transparent', border: 'none', cursor: 'pointer',
            fontFamily: 'inherit', textAlign: 'left',
          }}
        >
          <div style={{
            width: 36, height: 36, borderRadius: 9, flexShrink: 0,
            background: 'rgba(196,149,42,0.12)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Calculator size={16} color="var(--caramel)" />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-dark)', display: 'flex', gap: 10, alignItems: 'baseline' }}>
              {fmtPence(row.total_pence)}
              {variance !== null && (
                <span style={{ fontSize: 12, fontWeight: 700, color: variance === 0 ? 'var(--success)' : 'var(--warning)' }}>
                  {variance === 0 ? 'Balanced' : `${fmtPence(Math.abs(variance))} ${variance < 0 ? 'short' : 'over'}`}
                </span>
              )}
            </div>
            <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 2 }}>
              {format(date, 'EEE d MMM yyyy, HH:mm')}
              {' · by '}
              {row.closed_by_name || 'Unknown'}
              {' · '}
              {formatDistanceToNow(date, { addSuffix: true })}
            </div>
          </div>
        </button>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, flexShrink: 0, paddingRight: 12 }}>
          {onTillRoll && (
            <button onClick={onTillRoll} aria-label="Till roll" title="Till roll" className="btn-icon">
              <Receipt size={14} />
            </button>
          )}
          {canDelete && (
            <button onClick={onDelete} aria-label="Delete closing" title="Delete" className="btn-icon" style={{ color: 'var(--danger)' }}>
              <Trash2 size={14} />
            </button>
          )}
        </span>
      </div>
      {expanded && (
        <div style={{
          padding: '0 16px 14px 64px', fontSize: 12.5, color: 'var(--text-mid)',
          display: 'flex', flexDirection: 'column', gap: 4,
        }}>
          {reconciled && (
            <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', marginBottom: 6 }}>
              <span>Cash {fmtPenceShort(row.cash_taken_pence || 0)}</span>
              <span>Card {fmtPenceShort(row.card_sales_pence || 0)}</span>
              <span>Lifted {fmtPenceShort(row.cash_removed_pence || 0)}</span>
              <span>Left {fmtPenceShort((row.total_pence || 0) - (row.cash_removed_pence || 0))}</span>
              <span>Float {fmtPenceShort(row.opening_float_pence || 0)}</span>
            </div>
          )}
          {[...NOTES, ...COINS].filter(d => row[d.key] > 0).map(d => (
            <div key={d.key} style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span>{d.label} × {row[d.key]}</span>
              <span style={{ fontWeight: 600 }}>{fmtPence(row[d.key] * d.pence)}</span>
            </div>
          ))}
          {row.notes && (
            <div style={{
              marginTop: 6, padding: '6px 10px', borderRadius: 6,
              background: 'var(--parchment)', fontStyle: 'italic', color: 'var(--text-muted)',
            }}>
              "{row.notes}"
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── The page ─────────────────────────────────────────────────
function CashClosingPage() {
  const businessName = BUSINESS_NAME;

  // Per-coin entry: { src: 'weight' | 'count' | 'value' | null, input }.
  const [coinRows, setCoinRows] = useState(
    () => Object.fromEntries(COINS.map(c => [c.key, { src: null, input: '' }]))
  );
  const [noteCounts, setNoteCounts] = useState(
    () => Object.fromEntries(NOTES.map(n => [n.key, '']))
  );
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);
  const [mOpenKey, setMOpenKey] = useState(null);
  const [dOpenKey, setDOpenKey] = useState(null);
  const [mTab, setMTab] = useState('count');
  const [tillRoll, setTillRoll] = useState(null);

  const [periodFrom, setPeriodFrom] = useState(() => format(subDays(new Date(), 13), 'yyyy-MM-dd'));
  const [periodTo, setPeriodTo] = useState(() => format(new Date(), 'yyyy-MM-dd'));
  const [periodRows, setPeriodRows] = useState(null);
  const [periodLoading, setPeriodLoading] = useState(false);

  // Remembered on this device: who usually closes, and the float the
  // drawer is supposed to carry (the yardstick, not something counted).
  const [closedByName, setClosedByNameState] = useState(() => loadSettings().closedBy || '');
  const [expectedFloatInput, setExpectedFloatState] = useState(() => {
    const f = loadSettings().standardFloat;
    return f ? String(f) : '';
  });
  function setClosedByName(v) { setClosedByNameState(v); saveSetting('closedBy', v); }
  function setExpectedFloatInput(v) { setExpectedFloatState(v); saveSetting('standardFloat', v); }

  // The close: print the day's sales, read the cash taken off the
  // summary, lift that cash out, count what's left, close. The
  // printout and the count are independent sources — which is the
  // only reason a close can come out over or short.
  const [cashTakenInput,    setCashTakenInput]    = useState('');
  const [cashRemovedInput,  setCashRemovedInput]  = useState('');
  const [cardSalesInput,    setCardSalesInput]    = useState('');

  const toPence = s => Math.max(0, Math.round((Number(s) || 0) * 100));
  const expectedFloatPence = toPence(expectedFloatInput);
  const cashTakenPence     = toPence(cashTakenInput);
  const cashRemovedPence   = toPence(cashRemovedInput);
  const cardSalesPence     = toPence(cardSalesInput);

  // Cash lifted follows the printout until someone edits it.
  const removedTouched = useRef(false);
  useEffect(() => {
    if (!removedTouched.current) setCashRemovedInput(cashTakenInput);
  }, [cashTakenInput]);
  const setCashRemovedTouched = val => { removedTouched.current = true; setCashRemovedInput(val); };

  function setCoinRow(key, src, input) {
    setCoinRows(prev => ({ ...prev, [key]: { src, input } }));
  }
  const setNoteCount = (key, val) => setNoteCounts(prev => ({ ...prev, [key]: val }));

  const breakdown = useMemo(() => {
    const coinRowsData = COINS.map(c => {
      const { src, input } = coinRows[c.key] || {};
      const count = entryToCount(src, input, c);
      const grams = count > 0 ? Math.round(count * c.weightG * 100) / 100 : 0;
      return { ...c, src, input, count, grams, pence: count * c.pence };
    });
    const noteRowsData = NOTES.map(n => {
      const count = Math.max(0, parseInt(noteCounts[n.key], 10) || 0);
      return { ...n, count, pence: count * n.pence };
    });
    const coinsPence = coinRowsData.reduce((s, r) => s + r.pence, 0);
    const notesPence = noteRowsData.reduce((s, r) => s + r.pence, 0);
    const totalItems = coinRowsData.reduce((s, r) => s + r.count, 0) + noteRowsData.reduce((s, r) => s + r.count, 0);
    return { coinRows: coinRowsData, noteRows: noteRowsData, coinsPence, notesPence, totalPence: coinsPence + notesPence, totalItems };
  }, [coinRows, noteCounts]);

  // ── History (this browser) ────────────────────────────────
  const [allClosings, setAllClosings] = useState([]);
  const [loadingRecent, setLoadingRecent] = useState(true);
  useEffect(() => { setAllClosings(loadClosings()); setLoadingRecent(false); }, []);
  const recent = useMemo(
    () => [...allClosings].sort((a, b) => new Date(b.closed_at) - new Date(a.closed_at)).slice(0, 20),
    [allClosings],
  );

  function openPeriod() {
    setPeriodLoading(true);
    const data = allClosings.filter(r => {
      const d = format(new Date(r.closed_at), 'yyyy-MM-dd');
      return d >= periodFrom && d <= periodTo;
    }).sort((a, b) => new Date(a.closed_at) - new Date(b.closed_at));
    setPeriodLoading(false);
    if (periodFrom > periodTo) { toast.warning('The start date is after the end date.'); return; }
    if (data.length === 0) { toast.warning('No closes saved in that range.'); return; }
    setPeriodRows(data);
    track('cash-report', 'Opened a cash report');
  }

  function save() {
    if (breakdown.totalPence <= 0) {
      toast.warning('Count at least one note or coin before closing.');
      return;
    }
    setSaving(true);
    const payload = {
      id:                  newId(),
      closed_by_name:      closedByName.trim() || null,
      closed_at:           new Date().toISOString(),
      notes:               notes.trim() || null,
      coins_pence:         breakdown.coinsPence,
      notes_pence:         breakdown.notesPence,
      total_pence:         breakdown.totalPence,
      opening_float_pence: expectedFloatPence,
      cash_taken_pence:    cashTakenPence,
      cash_removed_pence:  cashRemovedPence,
      card_sales_pence:    cardSalesPence,
      count_basis:         'reconciled',
    };
    breakdown.coinRows.forEach(r => { payload[r.key] = r.count; });
    breakdown.noteRows.forEach(r => { payload[r.key] = r.count; });

    const next = [payload, ...allClosings].slice(0, 1000);
    const ok = saveClosings(next);
    setSaving(false);
    if (!ok) {
      toast.error("Couldn't save — this browser is blocking storage (private window?).");
      return;
    }
    setAllClosings(next);
    track('close-till', 'Closed the till');
    toast.success(`Closing saved · float left ${fmtPence(breakdown.totalPence - cashRemovedPence)}`);
    reset();
    setTillRoll(payload);
  }

  function reset() {
    setCoinRows(Object.fromEntries(COINS.map(c => [c.key, { src: null, input: '' }])));
    setNoteCounts(Object.fromEntries(NOTES.map(n => [n.key, ''])));
    setNotes('');
    setCashTakenInput('');
    setCashRemovedInput('');
    setCardSalesInput('');
    removedTouched.current = false;
    // Expected float and name survive a reset — they're not counted.
  }

  function deleteClosing(id) {
    if (!window.confirm('Delete this cash closing? This is permanent.')) return;
    const next = allClosings.filter(r => r.id !== id);
    if (!saveClosings(next)) { toast.error("Couldn't delete — storage is blocked."); return; }
    setAllClosings(next);
    toast.success('Closing deleted');
  }

  // ── Till roll / report as PDF ──────────────────────────────
  // html2canvas photographs the rendered slip and the image becomes a
  // page cut to its own proportions, so the PDF IS the slip on screen.
  const [rollBusy, setRollBusy] = useState(false);

  async function captureShare(node, name, summary, mode = 'share') {
    if (!node) return;
    if (!window.html2canvas || !window.jspdf) { toast.error('PDF tools did not load — check your connection.'); return; }
    setRollBusy(true);
    try {
      const canvas = await window.html2canvas(node, {
        backgroundColor: null,
        scale: Math.min(3, window.devicePixelRatio * 2 || 2),
        useCORS: true,
        logging: false,
      });
      const wMm = 80;
      const hMm = (canvas.height / canvas.width) * wMm;
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: [wMm, hMm], orientation: hMm > wMm ? 'portrait' : 'landscape' });
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, wMm, hMm);

      track(mode === 'save' ? 'slip-pdf' : 'slip-share', mode === 'save' ? 'Saved a slip as PDF' : 'Shared a slip');
      if (mode === 'save') {
        doc.save(name);
        toast.success('Saved');
        setRollBusy(false);
        return;
      }

      const outcome = await sharePdf({
        blob: doc.output('blob'),
        filename: name,
        title: 'Till roll',
        summary,
        save: n => doc.save(n),
      });
      if (outcome === 'saved' && canShareFiles()) {
        window.open(`https://wa.me/?text=${encodeURIComponent(summary)}`, '_blank', 'noopener');
        toast.info('Saved the PDF — attach it in WhatsApp, the summary is already in the message.');
      } else if (outcome === 'saved') {
        toast.success('Saved');
      }
    } catch (e) {
      toast.error(`Couldn't make the PDF: ${e.message}`);
    }
    setRollBusy(false);
  }

  function tillRollShare(row, node, mode) {
    const d = new Date(row.closed_at);
    return captureShare(node, `till-roll-${format(d, 'yyyy-MM-dd-HHmm')}.pdf`, [
      `Close of day ${format(d, 'EEE d MMM yyyy')}`,
      `Counted ${fmtPence(row.total_pence || 0)}`,
      `Lifted ${fmtPence(row.cash_removed_pence || 0)}`,
      `Float left ${fmtPence((row.total_pence || 0) - (row.cash_removed_pence || 0))}`,
      `Cash ${fmtPence(row.cash_taken_pence || 0)}`,
      ...((row.card_sales_pence || 0) > 0 ? [`Card ${fmtPence(row.card_sales_pence)}`] : []),
    ].join('\n'), mode);
  }

  function periodRollShare(node, mode) {
    const lifted = periodRows.reduce((t, r) => t + (r.cash_removed_pence || 0), 0);
    return captureShare(node, `cash-report-${periodFrom}-to-${periodTo}.pdf`, [
      `Cash report ${format(parseISO(periodFrom), 'd MMM')} – ${format(parseISO(periodTo), 'd MMM yyyy')}`,
      `${periodRows.length} close${periodRows.length === 1 ? '' : 's'}`,
      `Cash lifted ${fmtPence(lifted)}`,
    ].join('\n'), mode);
  }

  function exportPdf() {
    if (breakdown.totalPence <= 0) { toast.warning('Nothing to export — count something first.'); return; }
    if (!window.jspdf) { toast.error('PDF tools did not load — check your connection.'); return; }
    const stampLabel = format(new Date(), 'EEE d MMM yyyy · HH:mm');
    const { doc, autoTable, palette, addFooter } = createBrandedPdf({
      subtitle: 'CASH CLOSING',
      meta: [stampLabel],
      rightMeta: [`Closed by: ${closedByName.trim() || 'Unknown'}`],
    });

    autoTable({
      startY: 36,
      head: [['Coin', 'Weight', 'Count', 'Value']],
      body: breakdown.coinRows.filter(r => r.count > 0).map(r => [r.label, `${r.grams}g`, String(r.count), fmtPence(r.pence)]),
      foot: [['', '', 'Coins total', fmtPence(breakdown.coinsPence)]],
      columnStyles: { 0: { cellWidth: 30 }, 1: { cellWidth: 40, halign: 'center' }, 2: { cellWidth: 40, halign: 'center' }, 3: { halign: 'right' } },
    });

    autoTable({
      startY: doc.lastAutoTable.finalY + 6,
      head: [['Note', 'Quantity', 'Value']],
      body: breakdown.noteRows.filter(r => r.count > 0).map(r => [r.label, String(r.count), fmtPence(r.pence)]),
      foot: [['', 'Notes total', fmtPence(breakdown.notesPence)]],
      columnStyles: { 0: { cellWidth: 30 }, 1: { cellWidth: 50, halign: 'center' }, 2: { halign: 'right' } },
    });

    let y = doc.lastAutoTable.finalY + 8;
    if (cashTakenPence > 0 || cardSalesPence > 0 || expectedFloatPence > 0) {
      const floatLeft = breakdown.totalPence - cashRemovedPence;
      const body = [
        ['Cash sales', fmtPence(cashTakenPence)],
        ...(cardSalesPence > 0 ? [['Card sales', fmtPence(cardSalesPence)]] : []),
        ['Cash lifted', fmtPence(cashRemovedPence)],
        ['Float left', fmtPence(floatLeft)],
        ...(expectedFloatPence > 0 ? [
          ['Expected float', fmtPence(expectedFloatPence)],
          [floatLeft === expectedFloatPence ? 'Balanced' : floatLeft > expectedFloatPence ? 'Over' : 'Short',
           floatLeft === expectedFloatPence ? 'Spot on' : fmtPence(Math.abs(floatLeft - expectedFloatPence))],
        ] : []),
      ];
      autoTable({
        startY: y,
        head: [['The close', '']],
        body,
        columnStyles: { 0: { cellWidth: 80 }, 1: { halign: 'right' } },
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    doc.setFillColor(...palette.DARK);
    doc.roundedRect(14, y, 182, 18, 3, 3, 'F');
    doc.setTextColor(...palette.TAN);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('COUNTED IN TILL', 20, y + 11);
    doc.setFontSize(18);
    doc.setTextColor(...palette.CREAM);
    doc.text(fmtPence(breakdown.totalPence), 190, y + 12, { align: 'right' });

    if (notes.trim()) {
      doc.setFontSize(9);
      doc.setFont('helvetica', 'italic');
      doc.setTextColor(60, 40, 20);
      doc.text(doc.splitTextToSize(`Notes: ${notes.trim()}`, 182), 14, y + 26);
    }

    addFooter();
    doc.save(`cash-closing-${format(new Date(), 'yyyy-MM-dd-HHmm')}.pdf`);
    track('export-pdf', 'Exported the A4 PDF');
    toast.success('PDF exported');
  }

  const shared = {
    coins: COINS, noteDenoms: NOTES, coinRows, noteCounts, setCoinRow, setNoteCount,
    breakdown, notes, setNotes,
    expectedFloatInput, setExpectedFloatInput,
    cashTakenInput, setCashTakenInput,
    cashRemovedInput, setCashRemovedInput: setCashRemovedTouched,
    cardSalesInput, setCardSalesInput,
    expectedFloatPence, cashTakenPence, cashRemovedPence, cardSalesPence,
    closedByName, setClosedByName,
    saving, onSave: save, onReset: reset,
    recent, loadingRecent, canDelete: true, onDeleteClosing: deleteClosing, onTillRoll: setTillRoll,
    periodFrom, setPeriodFrom, periodTo, setPeriodTo, onOpenPeriod: openPeriod, periodLoading,
  };

  return (
    <>
      <header className="app-bar">
        <Calculator size={18} color="var(--tan)" />
        <span className="font-serif" style={{ flex: 1, fontSize: 17, fontWeight: 700 }}>Cash Closing</span>
        <span style={{ fontSize: 11.5, color: 'var(--tan)' }}>{businessName}</span>
      </header>
      <div className="page-content" style={{ width: '100%', maxWidth: 1180, margin: '0 auto' }}>
        {/* Two layouts over one set of state; CSS shows one. */}
        <MobileCashClose {...shared} openKey={mOpenKey} setOpenKey={setMOpenKey} tab={mTab} setTab={setMTab} />
        <DesktopCashClose {...shared} onExportPdf={exportPdf} openKey={dOpenKey} setOpenKey={setDOpenKey} />

        {periodRows && (
          <PeriodRoll
            rows={periodRows}
            from={periodFrom}
            to={periodTo}
            businessName={businessName}
            onClose={() => setPeriodRows(null)}
            onShare={periodRollShare}
            busy={rollBusy}
          />
        )}

        {tillRoll && (
          <TillRoll
            row={tillRoll}
            businessName={businessName}
            onClose={() => setTillRoll(null)}
            onShare={tillRollShare}
            busy={rollBusy}
          />
        )}
      </div>
      <div className="signature">
        <a href={PORTFOLIO_URL} target="_blank" rel="noopener">JeJo Barista · Aylesbury</a>
        <div style={{ marginTop: 3 }}>Cash Closing · saved on this device</div>
      </div>
      <ToastHost />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CashClosingPage />);
</script>
</body>
</html>
